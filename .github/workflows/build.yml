  build:
     runs-on: ubuntu-latest
   steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Get zygisk.hpp
        # Pinned to the API v5 header. Don't track master: the pltHookRegister
        # signature changed there and silently broke this build.
        run: curl -fsSL -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
        run: curl -fsSL -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/8ce2612/module/jni/zygisk.hpp

      - name: Build arm64-v8a
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 -j$(nproc)

      - name: Build armeabi-v7a
        run: |
